; NASA procurement bot settings and secrets.
; config.ini is NOT in git - copy config.example.ini to config.ini and chmod 600 it.

; Database
DB_HOST                     = "localhost"
DB_USER                     = "nasaprocurement"
DB_PASS                     = ""
DB_NAME                     = "nasaprocurement"

; SAM.gov API key (https://sam.gov -> Account Details -> Public API Key; expires every 90 days)
SAM_API_KEY                 = ""

; Mastodon (Preferences -> Development -> New application, scopes write:statuses write:media)
MASTODON_INSTANCE           = "https://mastodon.example"
MASTODON_TOKEN              = ""

; Bluesky (app password from https://bsky.app/settings/app-passwords)
BSKY_HANDLE                 = "yourbot.bsky.social"
BSKY_APP_PASSWORD           = ""

; Discord alerts: a script called as  php DISCORD_SCRIPT <channel id> "<@mention> message"
DISCORD_SCRIPT              = "/path/to/discord_send.php"
DISCORD_CHANNEL             = ""
DISCORD_MENTION             = ""

; Legacy, unused by the cron jobs
PUSHBULLET_TOKEN            = ""
TWITTER_CONSUMER_KEY        = ""
TWITTER_CONSUMER_SECRET     = ""
TWITTER_ACCESS_TOKEN        = ""
TWITTER_ACCESS_TOKEN_SECRET = ""
